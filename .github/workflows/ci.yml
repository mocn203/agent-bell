name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        node-version: [ 18.x, 20.x, 22.x ]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verify Zero Runtime Dependencies
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const deps = Object.keys(pkg.dependencies || {});
            if (deps.length > 0) {
              console.error('Violated zero-dependency rule! Found:', deps);
              process.exit(1);
            }
            console.log('Zero runtime dependencies verified.');
          "

      - name: Run Test Suite
        run: npm test

  syntax-check:
    name: Cloudflare Worker Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Verify Worker JavaScript Syntax
        run: |
          node --check worker/src/index.js
          node --check worker/src/discord.js
          node --check worker/src/slack.js
          echo "Worker syntax validated successfully."
